# Local reviewer/development stack, not a production deployment.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documents}
      POSTGRES_USER: ${POSTGRES_USER:-documents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documents}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documents} -d ${POSTGRES_DB:-documents}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # runserver supplies Admin static assets and plain HTTP for local review.
    command: python manage.py runserver 0.0.0.0:8000 --noreload
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      - embedding_cache:/app/.cache/embeddings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker --loglevel=info
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
      - embedding_cache:/app/.cache/embeddings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  embedding_cache:
