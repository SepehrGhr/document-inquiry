[project]
name = "document-inquiry"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "psycopg[binary]>=3.2,<3.3",
    "python-docx>=1.1,<2",
    "drf-spectacular>=0.28,<0.29",
    "gunicorn>=23,<24",
    "pgvector>=0.5,<0.6",
    "celery>=5.7,<5.8",
    "redis>=8.1,<8.2",
    "langchain>=1.4,<1.5",
    "langchain-core>=1.7,<1.8",
    "langchain-openai>=1.7,<1.8",
    "langchain-text-splitters>=1.1,<1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4.9,<5",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
