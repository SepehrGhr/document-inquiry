<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="630" viewBox="0 0 1400 630" role="img" aria-labelledby="journey-title journey-desc">
<title id="journey-title">From document to answer</title><desc id="journey-desc">A document is stored as a revision and indexed asynchronously. A later question searches the active build and returns an answer or abstention.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#88a9bb"/></marker></defs>
<rect width="1400" height="630" rx="18" fill="#0d1829"/>
<path d="M0 0H1400V8H0z" fill="#80d7d2"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="56" y="58" fill="#80d7d2" font-size="14" font-weight="700" letter-spacing="2">02 / JOURNEY</text>
<text x="56" y="100" fill="#f1f6ff" font-size="32" font-weight="700">From document to answer</text>
<text x="56" y="130" fill="#abc0d3" font-size="17">Two connected paths: prepare evidence, then ask a question</text><text x="56" y="190" fill="#80d7d2" font-size="13" font-weight="700" letter-spacing="1.5">A  /  DOCUMENT INGESTION</text><text x="56" y="393" fill="#80d7d2" font-size="13" font-weight="700" letter-spacing="1.5">B  /  QUESTION REQUEST</text><path d="M300 260H344" fill="none" stroke="#88a9bb" stroke-width="2"  marker-end="url(#arrow)"/><path d="M600 260H644" fill="none" stroke="#88a9bb" stroke-width="2"  marker-end="url(#arrow)"/><path d="M900 260H944" fill="none" stroke="#88a9bb" stroke-width="2"  marker-end="url(#arrow)"/><path d="M300 463H344" fill="none" stroke="#88a9bb" stroke-width="2"  marker-end="url(#arrow)"/><path d="M600 463H644" fill="none" stroke="#88a9bb" stroke-width="2"  marker-end="url(#arrow)"/><path d="M900 463H944" fill="none" stroke="#88a9bb" stroke-width="2"  marker-end="url(#arrow)"/><rect x="56" y="220" width="244" height="86" rx="8" fill="#182b40" stroke="#496279" stroke-width="1.5"/><text x="76" y="251" fill="#edf5fc" font-size="18" font-weight="700">Submit</text><text x="76" y="277" fill="#b2c5d6" font-size="14">Text or DOCX</text><rect x="344" y="220" width="256" height="86" rx="8" fill="#182b40" stroke="#496279" stroke-width="1.5"/><text x="364" y="251" fill="#edf5fc" font-size="18" font-weight="700">Save revision</text><text x="364" y="277" fill="#b2c5d6" font-size="14">Validate and commit</text><rect x="644" y="220" width="256" height="86" rx="8" fill="#182b40" stroke="#496279" stroke-width="1.5"/><text x="664" y="251" fill="#edf5fc" font-size="18" font-weight="700">Index in background</text><text x="664" y="277" fill="#b2c5d6" font-size="14">Chunk + embed</text><rect x="944" y="220" width="400" height="86" rx="8" fill="#1a3743" stroke="#7ecac5" stroke-width="1.5"/><text x="964" y="251" fill="#edf5fc" font-size="18" font-weight="700">Activate current build</text><text x="964" y="277" fill="#b2c5d6" font-size="14">Searchable evidence</text><rect x="56" y="423" width="244" height="86" rx="8" fill="#182b40" stroke="#496279" stroke-width="1.5"/><text x="76" y="454" fill="#edf5fc" font-size="18" font-weight="700">Ask</text><text x="76" y="480" fill="#b2c5d6" font-size="14">Question via API</text><rect x="344" y="423" width="256" height="86" rx="8" fill="#182b40" stroke="#496279" stroke-width="1.5"/><text x="364" y="454" fill="#edf5fc" font-size="18" font-weight="700">Retrieve</text><text x="364" y="480" fill="#b2c5d6" font-size="14">Search active build</text><rect x="644" y="423" width="256" height="86" rx="8" fill="#182b40" stroke="#496279" stroke-width="1.5"/><text x="664" y="454" fill="#edf5fc" font-size="18" font-weight="700">Generate + validate</text><text x="664" y="480" fill="#b2c5d6" font-size="14">Evidence and citations</text><rect x="944" y="423" width="400" height="86" rx="8" fill="#1a3743" stroke="#7ecac5" stroke-width="1.5"/><text x="964" y="454" fill="#edf5fc" font-size="18" font-weight="700">Return + record</text><text x="964" y="480" fill="#b2c5d6" font-size="14">Answer with sources or abstention</text><text x="56" y="570" fill="#aabfd1" font-size="15">Indexing is queued after commit; question answering runs synchronously.</text></g></svg>
